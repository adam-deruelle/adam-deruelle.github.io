<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Redirection…</title>
    <script>
      // Le site utilise des URL en #/… : on renvoie toute URL inconnue vers son équivalent.
      var p = location.pathname.replace(/\/+$/, '')
      location.replace('/#' + (p || '/') + location.search)
    </script>
  </head>
  <body><a href="/">Retour à l'accueil</a></body>
</html>
